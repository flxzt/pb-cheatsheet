[workspace]
members = ["crates/host", "crates/testclient", "crates/pb-client", "crates/com"]
resolver = "2"

[workspace.package]
authors = ["Felix Zwettler"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/flxzt/pb-cheatsheet"
rust-version = "1.78"
version = "0.1.0"

[workspace.dependencies]
pb-cheatsheet-com = { path = "crates/com" }

anyhow = "1.0"
ashpd = "0.13.9"
clap = { version = "4.5" }
embedded-graphics = "0.8.1"
futures = "0.3"
image = "0.25.10"
inkview = { version = "0.3.0", default-features = false }
inkview-eg = { version = "0.3.0", default-features = false }
postcard = { version = "0.6.0", features = ["use-std"] }
serde = "1.0"
serde_json = "1.0"
tarpc = "0.37.0"
tokio = { version = "1.53" }
tokio-util = "0.7.11"
tracing = "0.1.40"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.18"
url = "2.5"
zbus = "5.18"

[profile.release]
strip = true
# lto = 'fat'
